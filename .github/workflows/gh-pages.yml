name: GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 缓存 Hugo 模块
      - name: Cache Hugo modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/hugo_cache
            ~/go/pkg/mod
          key: ${{ runner.os }}-hugo-modules-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-hugo-modules-

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.139.3'
          extended: true

      - name: Build
        working-directory: ./pandawo
        run: hugo --baseURL https://daidaij.github.io/ --minify --gc

      # 预压缩已移除：封面全是远程图，public 里几乎没有可压位图；
      # GitHub Pages 的 Fastly 会现场压缩，仓库里的 .gz/.br 不会带 Content-Encoding。

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          PERSONAL_TOKEN: ${{ secrets.ACTION_TOKEN }}
          PUBLISH_DIR: ./pandawo/public
          EXTERNAL_REPOSITORY: daidaiJ/daidaiJ.github.io