{{/* 主源由 seed 在构建期打散；运行时只做故障降级，不再全局改写到同一源。 */}}
<script>
(function () {
    var KEY = 'pw-cover-v2';
    var TTL = 86400000;
    var CONTENT = ['met', 'unsplash', 'picsum'];
    var PROBES = {
        met: 'https://images.metmuseum.org/CRDImages/ep/web-large/DT1502_cropped2.jpg',
        unsplash: 'https://images.unsplash.com/photo-1579783902614-a3fb3927b6a5?w=32&h=32&fit=crop&q=10',
        picsum: 'https://picsum.photos/id/237/32/32.webp',
        wsrv: 'https://wsrv.nl/?url=wsrv.nl/lichtenstein.jpg&w=32&h=32'
    };

    function read() {
        try {
            var o = JSON.parse(localStorage.getItem(KEY) || '');
            if (o && o.order && o.order.length && (Date.now() - o.ts) < TTL) return o.order;
        } catch (e) {}
        return null;
    }

    function write(order) {
        try { localStorage.setItem(KEY, JSON.stringify({ order: order, ts: Date.now() })); } catch (e) {}
    }

    var backupPref = read() || ['wsrv', 'weserv', 'met', 'unsplash', 'picsum'];

    function keysOf(el) {
        var primary = el.getAttribute('data-primary') || 'met';
        var keys = [primary, 'wsrv', 'weserv'];
        var rest = backupPref.concat(CONTENT);
        for (var i = 0; i < rest.length; i++) {
            var k = rest[i];
            if (keys.indexOf(k) === -1) keys.push(k);
        }
        return keys;
    }

    function urlsOf(el) {
        var keys = keysOf(el);
        var out = [];
        for (var i = 0; i < keys.length; i++) {
            var u = el.getAttribute('data-' + keys[i]);
            if (u && out.indexOf(u) === -1) out.push(u);
        }
        var src = el.getAttribute('src');
        if (src && out.indexOf(src) === -1) out.unshift(src);
        return out;
    }

    function bind(el) {
        if (el.getAttribute('data-pw-bound')) return;
        el.setAttribute('data-pw-bound', '1');
        var urls = urlsOf(el);
        if (!urls.length) return;
        var i = urls.indexOf(el.getAttribute('src') || '');
        if (i < 0) i = 0;
        el.addEventListener('error', function () {
            i += 1;
            if (i < urls.length) el.src = urls[i];
        });
    }

    function scan(node) {
        if (!node || node.nodeType !== 1) return;
        if (node.matches && node.matches('img[data-cover-fallback]')) bind(node);
        if (node.querySelectorAll) {
            var list = node.querySelectorAll('img[data-cover-fallback]');
            for (var i = 0; i < list.length; i++) bind(list[i]);
        }
    }

    var obs = new MutationObserver(function (muts) {
        for (var i = 0; i < muts.length; i++) {
            var nodes = muts[i].addedNodes;
            for (var j = 0; j < nodes.length; j++) scan(nodes[j]);
        }
    });
    obs.observe(document.documentElement, { childList: true, subtree: true });

    function probe(url) {
        return new Promise(function (resolve, reject) {
            var img = new Image();
            var t0 = performance.now();
            var to = setTimeout(function () { img.src = ''; reject(new Error('timeout')); }, 2500);
            img.onload = function () { clearTimeout(to); resolve(performance.now() - t0); };
            img.onerror = function () { clearTimeout(to); reject(new Error('error')); };
            img.src = url;
        });
    }

    function race() {
        if (read()) return;
        var names = Object.keys(PROBES);
        Promise.all(names.map(function (k) {
            return probe(PROBES[k]).then(function (ms) {
                return { k: k, ms: ms };
            }).catch(function () {
                return { k: k, ms: 1e9 };
            });
        })).then(function (rows) {
            rows.sort(function (a, b) { return a.ms - b.ms; });
            var next = ['wsrv', 'weserv'];
            for (var i = 0; i < rows.length; i++) {
                if (rows[i].ms < 1e9 && next.indexOf(rows[i].k) === -1) next.push(rows[i].k);
            }
            for (var j = 0; j < CONTENT.length; j++) {
                if (next.indexOf(CONTENT[j]) === -1) next.push(CONTENT[j]);
            }
            write(next);
            backupPref = next;
        });
    }

    var start = function () {
        if (window.requestIdleCallback) requestIdleCallback(race, { timeout: 4000 });
        else setTimeout(race, 2000);
    };
    if (document.readyState === 'complete') start();
    else window.addEventListener('load', start);
})();
</script>
