{{- $permalink := .permalink -}}
{{- $alt := .alt -}}
{{- $loading := .loading | default "eager" -}}
{{- $priority := .priority | default "" -}}
{{- $c := partial "helper/cover-remote" (dict "permalink" $permalink "seed" .seed "w" (.w | default 800) "h" (.h | default 600)) -}}
<img src="{{ $c.primaryUrl }}"
    width="{{ .w | default 800 }}"
    height="{{ .h | default 600 }}"
    loading="{{ $loading }}"
    decoding="async"
    {{- if $priority }} fetchpriority="{{ $priority }}"{{ end }}
    alt="{{ $alt }}"
    data-cover-fallback
    data-primary="{{ $c.primary }}"
    data-met="{{ $c.met }}"
    data-unsplash="{{ $c.unsplash }}"
    data-picsum="{{ $c.picsum }}"
    data-wsrv="{{ $c.wsrv }}"
    data-weserv="{{ $c.weserv }}" />
