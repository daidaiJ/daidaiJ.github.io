{{- if .Store.Get "hasMermaid" -}}
<script type="module">
    import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs')
        .then(({ default: mermaid }) => {
            const elements = Array.from(document.querySelectorAll('.mermaid'));
            if (!elements.length) return;
            const sources = elements.map(el => el.innerHTML);
            let currentScheme = null;

            const render = () => {
                const scheme = document.documentElement.dataset.scheme;
                if (scheme === currentScheme) return;
                currentScheme = scheme;

                const dark = scheme === 'dark';
                mermaid.initialize({
                    startOnLoad: false,
                    theme: dark ? 'dark' : 'neutral',
                    securityLevel: 'strict'
                });
                elements.forEach((el, i) => {
                    el.removeAttribute('data-processed');
                    el.innerHTML = sources[i];
                });
                return mermaid.run({ nodes: elements }).then(() => {
                    elements.forEach(el => { el.style.visibility = ''; });
                });
            };

            render();
            window.addEventListener('onColorSchemeChange', render);
        })
        .catch((error) => {
            console.warn('Mermaid 加载失败，图表将显示为代码块:', error);
        });
</script>
{{- end -}}
