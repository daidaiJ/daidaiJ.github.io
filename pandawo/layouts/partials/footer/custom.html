{{- if .Store.Get "hasMermaid" -}}
<script type="module">
    // Pele：同步渲染 SVG，颜色走 --pele-* CSS 变量，明暗切换无需重渲染
    import('https://cdn.jsdelivr.net/npm/pele@1.9.0/dist/pele.min.js')
        .then(({ mount, PeleError }) => {
            const elements = Array.from(document.querySelectorAll('.mermaid'));
            if (!elements.length) return;
            elements.forEach(el => {
                try {
                    mount(el, el.textContent);
                } catch (error) {
                    if (!(error instanceof PeleError)) throw error;
                    console.warn('Pele 渲染失败，图表将显示为代码块:', error.message);
                }
                el.style.visibility = '';
            });
        })
        .catch((error) => {
            console.warn('Pele 加载失败，图表将显示为代码块:', error);
            document.querySelectorAll('.mermaid').forEach(el => { el.style.visibility = ''; });
        });
</script>
{{- end -}}
